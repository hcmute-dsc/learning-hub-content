name: Validate content

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # The validator lives in the app repo (packages/content), so app and content
      # always agree on the format.
      - uses: actions/checkout@v5
        with:
          repository: hcmute-dsc/learning-hub
          path: .hub
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the validator
        working-directory: .hub
        run: |
          npx -y pnpm@9.15.4 install --frozen-lockfile --filter @hub/content...
          npx -y pnpm@9.15.4 --filter @hub/content build
      # The registry (tracks.yaml) pins each track repo at a commit: put every track in
      # one folder and validate them together (ADR-10), with the tracks still kept here.
      - name: Collect the tracks of the registry
        run: node tools/assemble-registry.mjs .hub .check
      - name: Validate all tracks together
        run: node .hub/packages/content/dist/cli.js .check

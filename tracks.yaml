# Registry of Learning Hub tracks (DECISIONS ADR-10, CONTENT-SPECIFICATION §1).
# Each track lives in its own repo, hcmute-dsc/learning-hub-track-<slug>. The hub
# publishes each track at the commit written here, never at a branch.
#
# To publish a new version of a track: open a PR that changes its `commit` to a commit
# on the track repo's main. CI checks every track together; the club board reviews.
#
#   - slug: sql-30-days                                   # = tracks/<slug>/ in the repo
#     repo: hcmute-dsc/learning-hub-track-sql-30-days
#     commit: "0123456789abcdef0123456789abcdef01234567"  # full 40-character SHA
tracks:
  - slug: sql-30-days
    repo: hcmute-dsc/learning-hub-track-sql-30-days
    commit: "8d8d3e9f39c480390be429413c0f79c97154e13a"
  - slug: discord-webhook-automation
    repo: hcmute-dsc/learning-hub-track-discord-webhook-automation
    commit: "181d1dda5c4f1450f450a418d4831e0791e94ba2"
  - slug: actions-docker
    repo: hcmute-dsc/learning-hub-track-actions-docker
    commit: "0aed5cd228af9c0815720c40e8cb098814b2c1ab"
  - slug: github-actions-basics
    repo: hcmute-dsc/learning-hub-track-github-actions-basics
    commit: "c17c8819ef43a8210cc692cb9c3bcd8aa69e3d8d"
  - slug: docker-basics
